# _config.butterfly.yml — 站点自定义覆盖（butterfly 5.7.0）
# 仅存放与主题默认值不同的定制项，未列出的键沿用主题默认；升级主题时只需对照本文件。
# 2026-09-12 由 4.5.1 全量配置迁移至 5.7 结构（highlight_*→code_blocks、fancybox→lightbox、
# sharejs→share.use、subtitle 速度参数→typed_option、mathjax/katex→math，均已按新结构改写）
# ----------------------------------------------------------------

# 导航菜单
menu:
  Home: / || fas fa-home
  Archives: /archives/ || fas fa-archive
  Tags: /tags/ || fas fa-tags
  Categories: /categories/ || fas fa-folder-open
  About: /about/ || fas fa-heart

# 社交图标
social:
  fab fa-github: https://github.com/deltacat || Github

# 站点图标 / 头像
favicon: /images/maols-avatar1.png
avatar:
  img: /images/maols-avatar1.png

# 首页 banner 与文章默认封面
index_img: /images/banner01.png
cover:
  default_cover:
    - /images/banner01.png
    - /images/banner02.png
    - /images/banner03.png

# 404 页（subtitle 沿用默认 'Page Not Found'）
error_404:
  enable: true
  background: /images/maols-avatar1.png

# 评论系统：已关闭（原 Valine + LeanCloud 后端，LeanCloud 停服后失效，2026-09-12 移除）
# 备选：giscus（GitHub Discussions，零后端）/ Waline、Twikoo（需自建后端）
comments:
  use:

# 页脚（建站年份 + ICP 备案）
footer:
  owner:
    since: 2009
  custom_text: <a href="https://beian.miit.gov.cn/">浙ICP备19020493号-1</a>

# 主页副标题（打字机效果；5.x 起速度参数经 typed_option 透传 typed.js）
subtitle:
  enable: true
  effect: true
  typed_option:
    startDelay: 100
    typeSpeed: 100
    backSpeed: 50
    loop: false
  sub:
    - 莫听穿林打叶声，何妨吟啸且徐行
    - 竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生
    - 料峭春风吹酒醒，微冷，山头斜照却相迎
    - 回首向来萧瑟处，归去，也无风雨也无晴

# 侧栏
aside:
  card_author:
    button:
      link: https://github.com/deltacat
  card_announcement:
    enable: false
  card_categories:
    limit: 0

# 图片查看（4.x 的 fancybox: true → 5.x 统一为 lightbox）
lightbox: fancybox

# mermaid 图表
mermaid:
  enable: true
